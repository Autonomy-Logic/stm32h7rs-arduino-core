# SPDX-License-Identifier: Apache-2.0
name: STM32H7S7 core checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: 1.3.1
  ZEPHYR_SDK_VERSION: 1.0.1

jobs:
  unit-tests:
    name: Check scripts, host and Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'
      - name: CI check script tests
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: Host tests (EthernetServer client table)
        run: make -C tools/ci/host-tests check
      - name: stm32h7rs-tool tests
        working-directory: tools/stm32h7rs-tool
        run: |
          go vet ./...
          go test ./...
      - name: Bootloader host tests (protocol code, and stm32h7rs-tool against the bootloader's TFTP server)
        run: make -C bootloader/tests check

  build:
    name: Bootloader, loaders and sketches
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          path: stm32h7rs-arduino-core
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler jq rsync
      - name: Cache west modules and Zephyr SDK
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
            zephyr-sdk
          key: west-${{ hashFiles('stm32h7rs-arduino-core/west.yml') }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}
      - name: West workspace
        working-directory: stm32h7rs-arduino-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install west protobuf grpcio-tools jsonschema
          [ -d ../.west ] || west init -l .
          west config manifest.project-filter -- "-hal_.*,+hal_stm32"
          west update --narrow -o=--depth=1
          pip install -r ../zephyr/scripts/requirements-base.txt
          [ -d ../zephyr-sdk ] || west sdk install --version $ZEPHYR_SDK_VERSION -t arm-zephyr-eabi --install-dir ../zephyr-sdk --personal-access-token "$GH_TOKEN"
          west blobs fetch arduino-api --auto-accept
      - name: Dependencies pinned by commit
        working-directory: stm32h7rs-arduino-core
        run: |
          source venv/bin/activate
          west manifest --resolve --active-only > /tmp/resolved.yml
          python3 tools/ci/check_west_pins.py /tmp/resolved.yml
      - name: Build the network bootloader (the linker script caps it at 56 KB)
        working-directory: stm32h7rs-arduino-core
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk
        run: ./bootloader/build.sh
      - name: Build loaders
        working-directory: stm32h7rs-arduino-core
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
          PINNED_CORE_VERSION: 0.2.1
        run: |
          extra/build.sh stm32h7s7
          extra/build.sh sl_visu_5r
      - name: Loader network features and thread priorities
        working-directory: stm32h7rs-arduino-core
        run: |
          for v in stm32h7s7_core_stm32h7s7xx_ext_flash_app stm32h7s7_core_stm32h7s7xx_sl_visu_5r; do
            python3 tools/ci/check_loader_config.py firmwares/zephyr-$v.config
          done
      - name: Flash layout agrees between the loaders, the bootloader contract and boards.txt
        working-directory: stm32h7rs-arduino-core
        run: tools/ci/check_all_layouts.sh
      - name: arduino-cli with the working-tree core
        run: |
          mkdir -p arduino/bin arduino/sketchbook/hardware/AutonomyLogic
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz | tar -xz -C arduino/bin arduino-cli
          echo "ARDUINO_DIRECTORIES_DATA=$GITHUB_WORKSPACE/arduino/data" >> $GITHUB_ENV
          echo "ARDUINO_DIRECTORIES_USER=$GITHUB_WORKSPACE/arduino/sketchbook" >> $GITHUB_ENV
          ln -s $GITHUB_WORKSPACE/stm32h7rs-arduino-core arduino/sketchbook/hardware/AutonomyLogic/zephyr_h7rs
          (cd stm32h7rs-arduino-core/tools/stm32h7rs-tool && go build -o $GITHUB_WORKSPACE/arduino/bin/stm32h7rs-tool ./cmd/stm32h7rs-tool)
      - name: Toolchain from Arduino's index
        run: |
          arduino/bin/arduino-cli core update-index
          arduino/bin/arduino-cli core install arduino:zephyr_contrib@1.1.0
      - name: Compile sketches into program images
        run: |
          props="--build-property build.stm32h7rs_tool=$GITHUB_WORKSPACE/arduino/bin/stm32h7rs-tool"
          s=stm32h7rs-arduino-core/tools/ci/sketches
          arduino/bin/arduino-cli compile -b AutonomyLogic:zephyr_h7rs:stm32h7s7 $props --output-dir out/generic-blink $s/blink
          arduino/bin/arduino-cli compile -b AutonomyLogic:zephyr_h7rs:sl_visu_5r $props --output-dir out/sv5-blink $s/blink
          arduino/bin/arduino-cli compile -b AutonomyLogic:zephyr_h7rs:sl_visu_5r $props --output-dir out/sv5-hal-api $s/sl_visu_5r_hal_api
      - name: Program images pass the bootloader's image check, a tampered one does not
        run: |
          check=stm32h7rs-arduino-core/build/bootloader-tests/bootloader_tests
          for d in generic-blink sv5-blink sv5-hal-api; do
            $check out/$d/*.image.bin
          done
          python3 -I stm32h7rs-arduino-core/bootloader/tests/tamper.py out/sv5-blink/blink.ino.image.bin /tmp/tampered.bin
          if $check /tmp/tampered.bin; then echo "tampered image accepted"; exit 1; fi
      - name: Release rehearsal (archive, tools, index; install into an empty arduino-cli and compile)
        working-directory: stm32h7rs-arduino-core
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          source venv/bin/activate
          tools/ci/build_release.sh 0.2.1 http://127.0.0.1:8765 distrib/rehearsal
          (cd distrib/rehearsal && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          export ARDUINO_DIRECTORIES_DATA=$RUNNER_TEMP/fresh/data ARDUINO_DIRECTORIES_USER=$RUNNER_TEMP/fresh/user
          export ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS=http://127.0.0.1:8765/package_AutonomyLogic_stm32h7rs_index.json
          A=$GITHUB_WORKSPACE/arduino/bin/arduino-cli
          $A core update-index
          $A core install AutonomyLogic:zephyr_h7rs@0.2.1
          for b in stm32h7s7 sl_visu_5r; do
            $A compile -b AutonomyLogic:zephyr_h7rs:$b --output-dir $RUNNER_TEMP/rehearsal-$b tools/ci/sketches/blink
            build/bootloader-tests/bootloader_tests $RUNNER_TEMP/rehearsal-$b/blink.ino.image.bin
          done
      - name: Artefacts
        uses: actions/upload-artifact@v7
        with:
          name: stm32h7s7-core-images
          path: |
            stm32h7rs-arduino-core/build/bootloader/
            stm32h7rs-arduino-core/firmwares/
            out/
