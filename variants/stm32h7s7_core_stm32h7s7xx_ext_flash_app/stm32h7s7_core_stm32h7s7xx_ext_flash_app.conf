# Generic STM32H7S7 loader: MCU-level features only, no device peripherals.

# --- STM32H7S7 core: settings shared by every variant (keep identical in each variant .conf) ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="STM32H7RS OpenPLC"
CONFIG_USB_DEVICE_MANUFACTURER="Autonomy Logic"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_SHELL=n

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_HEAP_MEM_POOL_SIZE=32768
# Sketch RAM (static mode places the sketch .data/.bss in the LLEXT heap); main stack in DTCM to make room.
CONFIG_LLEXT_HEAP_SIZE=256
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_MAIN_STACK_REGION="DTCM"

CONFIG_FPU=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y

# MCUboot image: the loader starts after the 0x400-byte image header and stops at user_sketch.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_ROM_START_OFFSET=0x400
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_STM32_XSPI_RAM_RELOCATION=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y

CONFIG_ARDUINO_STM32_DISPLAY_HAL=y

CONFIG_ENTROPY_GENERATOR=y
# --- end of shared settings ---
