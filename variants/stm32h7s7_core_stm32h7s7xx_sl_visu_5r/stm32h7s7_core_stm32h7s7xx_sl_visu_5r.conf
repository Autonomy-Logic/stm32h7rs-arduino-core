# SPDX-License-Identifier: Apache-2.0
# Synergy Logic SL-VISU-5R loader: the shared STM32H7S7 settings plus PSRAM and Ethernet.

# --- STM32H7S7 core: settings shared by every variant (keep identical in each variant .conf) ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="STM32H7RS OpenPLC"
CONFIG_USB_DEVICE_MANUFACTURER="Autonomy Logic"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_SHELL=n

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_HEAP_MEM_POOL_SIZE=32768
# Sketch RAM (static mode places the sketch .data/.bss in the LLEXT heap); main stack in DTCM to make room.
CONFIG_LLEXT_HEAP_SIZE=256
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_MAIN_STACK_REGION="DTCM"

CONFIG_FPU=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y

# MCUboot image: the loader starts after the 0x400-byte image header and stops at user_sketch.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
CONFIG_ROM_START_OFFSET=0x400
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_STM32_XSPI_RAM_RELOCATION=y
# Memory-mapped reads with D-cache invalidation after each erase or write.
CONFIG_FLASH_STM32_NOR_MEMMAP=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y

CONFIG_ARDUINO_STM32_DISPLAY_HAL=y

CONFIG_ENTROPY_GENERATOR=y
# --- end of shared settings ---

CONFIG_MEMC=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_NET_MGMT=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_XSI_SINGLE_PROCESS=y
CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_FILE_SYSTEM=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1

# Nothing is configured at boot: the interface gets an address only when the sketch calls Ethernet.begin().
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_AUTO_INIT=n

# Listener + 3 Modbus TCP clients + 1 connection being refused + DHCP + discovery UDP + DNS = 8.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8

# Every network, Ethernet and USB thread runs below the sketch main thread (priority 2).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=8
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=8
CONFIG_NET_TCP_WORKER_PRIO=8
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=8
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=8
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=8

CONFIG_ARDUINO_ETHERNET_KEEP_DRIVER_MAC=y
