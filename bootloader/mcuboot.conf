# SPDX-License-Identifier: Apache-2.0
# MCUboot configuration of the STM32H7S7 core: one program slot in external flash, USB CDC ACM serial recovery
# entered by the retained boot mode (1200 bps request) or when no valid image exists.

CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_FLASH_STM32_NOR_MEMMAP=y

CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_REBOOT=y

CONFIG_USBD_MSG_DEFERRED_MODE=n
CONFIG_USBD_BOS_SUPPORT=n
CONFIG_USBD_VREQ_SUPPORT=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PM=n

CONFIG_RETAINED_MEM=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_BOOT_SERIAL_IMG_GRP_HASH=n
CONFIG_SERIAL=y
CONFIG_GPIO=n
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_MAX_SPEED_FULL=y
CONFIG_TIMESLICING=n
CONFIG_HWINFO=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
